# Sàn volume tối thiểu khi rank biến động 24h (USDT)
min_quote_volume_top: 500000
# ====================== BOT SETTINGS ======================
mode: testnet
exchange: binanceusdm

# isolated | cross
margin_mode: cross

top_n: 50
scan_interval_seconds: 120

# Quét song song (nhanh hơn với top_n lớn)
scan_parallel: true
scan_workers: 8

# Symbol không quét (blacklist). VD: BTC, DOGE/USDT:USDT
excluded_symbols: []
timeframes: ["15m", "1h", "4h"]

enabled_strategies:
  - VWAPEMA9
  - FibPullback
  - MartinEMAPullback
  - SupplyDemand
  - EMARSIMACDDay

strategy_params:
  VWAPEMA9:
    enable_long: false
    enable_short: true
    rr: 1.2
    min_rr: 1.0
    sl_buffer_atr: 0.45
    touch_pct: 0.0015
    pullback_lookback: 4
    require_vwap_side: true
    # BT: n=116 WR=59.5% meanR=0.238 totalR=27.6 PF=1.56 score=27.1
  FibPullback:
    rr: 1.2
    min_rr: 1.0
    atr_sl_mult: 1.4
    # BT: n=86 WR=80.2% meanR=0.302 totalR=26.0 PF=2.51 score=25.8
  MartinEMAPullback:
    rr: 1.2
    # BT: n=194 WR=44.8% meanR=0.122 totalR=23.7 PF=1.2 score=22.8
  SupplyDemand:
    rr: 1.5
    min_rr: 1.2
    atr_sl_mult: 1.6
    # BT: n=156 WR=46.8% meanR=0.056 totalR=8.8 PF=1.1 score=7.6
  EMARSIMACDDay:
    rr: 1.5
    min_rr: 1.3
    # BT: n=10 WR=60.0% meanR=0.374 totalR=3.7 PF=1.87 score=3.6
  TrendMA:
    rr: 1.5
    min_rr: 1.2
    atr_sl_mult: 1.6
    # BT: n=213 WR=46.5% meanR=0.012 totalR=2.6 PF=1.02 score=1.1
  PullbackEMA:
    rr: 1.2
    min_rr: 1.0
    atr_sl_mult: 1.4
    # BT: n=76 WR=53.9% meanR=0.02 totalR=1.5 PF=1.04 score=0.8
  StochBB:
    rr: 1.5
    min_rr: 1.2
    atr_sl_mult: 1.6
    # BT: n=28 WR=60.7% meanR=-0.059 totalR=-1.6 PF=0.86 score=-2.1
  SwingMACross:
    rr: 1.2
    min_rr: 1.0
    atr_sl_mult: 1.4
    # BT: n=24 WR=50.0% meanR=-0.074 totalR=-1.8 PF=0.86 score=-2.3
  OrderBlock:
    rr: 1.2
    min_rr: 1.0
    atr_sl_mult: 1.4
    # BT: n=20 WR=45.0% meanR=-0.201 totalR=-4.0 PF=0.68 score=-4.4
  SwingRSI:
    rr: 1.5
    min_rr: 1.2
    atr_sl_mult: 1.6
    # BT: n=178 WR=43.8% meanR=-0.035 totalR=-6.2 PF=0.94 score=-7.6
  BBSqueeze:
    rr: 1.2
    min_rr: 1.0
    atr_sl_mult: 1.4
    # BT: n=53 WR=39.6% meanR=-0.243 totalR=-12.9 PF=0.64 score=-14.0
  MomentumRSI:
    rr: 1.2
    min_rr: 1.0
    atr_sl_mult: 1.4
    # BT: n=73 WR=43.8% meanR=-0.206 totalR=-15.0 PF=0.68 score=-16.5
  EMARSIScalp:
    rr: 1.2
    min_rr: 1.0
    atr_sl_mult: 1.4
    # BT: n=77 WR=42.9% meanR=-0.23 totalR=-17.7 PF=0.64 score=-19.9
  FVG:
    rr: 1.5
    min_rr: 1.2
    atr_sl_mult: 1.6
    # BT: n=238 WR=44.1% meanR=-0.074 totalR=-17.6 PF=0.88 score=-20.0

# ====================== BOT SETTINGS ======================
# mode: paper | testnet | live
mode: testnet

# Symbols: top N by 24h volatility (not volume)
top_n: 50
min_quote_volume_top: 500000

# Timeframes (5m/15m → scalp, 1h/2h → day, 4h+ → swing)
timeframes:
  - "15m"
  - "1h"

scan_interval_seconds: 120
scan_parallel: true
scan_workers: 4

# Margin: isolated | cross
margin_mode: cross

# Blacklist (Discord: !exclude add SYMBOL)
excluded_symbols: []

# ====================== STRATEGIES ======================
# Gợi ý sau backtest (edge rõ). Bật thêm bằng Discord !strategy on NAME
enabled_strategies:
  - TrendFibVWAP


# ====================== STRATEGY PARAMS (tuned) ======================
strategy_params:
  TrendFibVWAP:
  ema_fast: 21
  ema_slow: 50
  ema_trend: 200
  ema9: 9
  vwap_window: 96
  touch_pct: 0.0025
  pullback_lookback: 6
  swing_lookback: 60
  fib_lo: 0.5
  fib_hi: 0.786
  min_score: 2
  require_trend: true
  require_vwap: false
  rr: 1.5
  sl_buffer_atr: 0.55
  atr_period: 14
  min_atr_pct: 0.0015
  enable_long: false      # sample: short mạnh hơn
  enable_short: true
  vol_filter: true
  vol_ma_period: 20
  vol_min_ratio: 0.9
  rsi_filter: false       # 15m short noRSI tốt hơn có RSI
  rsi_period: 14
  rsi_long_min: 35
  rsi_long_max: 58
  rsi_short_min: 42
  rsi_short_max: 68

# Biến thể chất lượng cao (ít lệnh):
#   min_score: 3
#   enable_long: true
#   enable_short: true
#   rsi_filter: true
  Supertrend:
    # Tối ưu backtest (ETH/SOL/BTC · 15m/1h/4h): SHORT-only ATR14×3 RR1.5
    # WR~42% meanR=+0.13 totalR=+34 PF~1.38 maxDD~-6.5
    atr_period: 14
    factor: 3.0
    rr: 1.5
    min_rr: 1.2
    sl_buffer_atr: 0.15
    min_atr_pct: 0.001
    enable_long: true
    enable_short: true
    only_on_flip: true
  LuxICTConfluence:
    pivot_len: 3
    msb_lookback: 40
    msb_body_atr: 0.85
    fvg_max_age: 30
    min_gap_pct: 0.001
    liq_lookback: 25
    fib_low: 0.5
    fib_high: 0.786
    require_fib: false          # Fib OTE optional (strict hơn nếu true)
    require_liq_sweep: true     # quét thanh khoản
    require_fvg: true
    require_ob: false
    vol_mult: 1.15
    vol_ma: 20
    rr: 1.5
    min_rr: 1.2
    sl_buffer_atr: 0.35
    enable_long: false          # LONG yếu trên sample → mặc định tắt
    enable_short: true
    min_score: 3

  VWAPEMA9:
    ema_period: 9
    use_daily_vwap: true
    vwap_window: 48
    touch_pct: 0.0015
    pullback_lookback: 4
    rr: 1.2
    min_rr: 1.0
    sl_buffer_atr: 0.45
    sl_swing_lookback: 10
    min_atr_pct: 0.0012
    require_vwap_side: true
    enable_long: false
    enable_short: true

  FibPullback:
    rr: 1.2
    min_rr: 1.0
    atr_sl_mult: 1.4
    lookback: 50

  MartinEMAPullback:
    ema_fast: 9
    ema_mid: 21
    ema_slow: 50
    rr: 1.2
    min_rr: 1.0
    enable_long_9: true
    enable_long_21: true
    enable_long_50: true
    enable_short_9: true
    enable_short_21: true
    enable_short_50: true

  SupplyDemand:
    rr: 1.5
    atr_sl_mult: 1.6
    lookback: 40

  EMARSIMACDDay:
    ema_fast: 21
    ema_mid: 50
    ema_slow: 200
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    rr: 1.5
    min_rr: 1.2
    pullback_lookback: 5
    sl_swing_lookback: 10
    sl_buffer_atr: 0.4

  # Defaults for other strategies (if enabled later)
  ORB:
    rr: 1.25
    atr_sl_mult: 1.35
  LiquiditySweep:
    rr: 1.25
    atr_sl_mult: 1.4
  MARibbon:
    rr: 1.25
    atr_sl_mult: 1.35
  StochBB:
    rr: 1.25
    atr_sl_mult: 1.4
  PivotScalp:
    rr: 1.25
    atr_sl_mult: 1.35
  EMARSIScalp:
    rr: 1.25
    atr_sl_mult: 1.4
  OrderBlock:
    rr: 1.3
    atr_sl_mult: 1.6
  FVG:
    rr: 1.3
    atr_sl_mult: 1.6
  BOS_CHOCH:
    rr: 1.3
    atr_sl_mult: 1.7
  TrendMA:
    rr: 1.3
    atr_sl_mult: 1.7
  MomentumRSI:
    rr: 1.3
    atr_sl_mult: 1.6
  PullbackEMA:
    rr: 1.3
    atr_sl_mult: 1.6
  RangeBounce:
    rr: 1.25
    atr_sl_mult: 1.5
  PremiumDiscount:
    lookback: 50
    discount_max: 0.35
    premium_min: 0.65
    rr: 1.3
    require_rejection: true
  OI_Funding:
    rr: 1.4
    atr_sl_mult: 2.2
  SwingMACross:
    rr: 1.4
    atr_sl_mult: 2.2
  SwingRSI:
    rr: 1.4
    atr_sl_mult: 2.2
  BBSqueeze:
    rr: 1.35
    atr_sl_mult: 2.0

# ====================== SIGNAL REFINE ======================
# Với 5 strategy: tắt bias+trigger & consensus chặt; giữ HTF tùy chọn
signal_refine:
  consensus_enabled: false
  min_strategy_agree: 1
  consensus_same_style: false
  bias_trigger_enabled: false

  htf_bias_enabled: true
  htf_timeframe: "1h"
  htf_ema_fast: 21
  htf_ema_slow: 50

  mtf_enabled: false
  mtf_timeframes:
    - "1h"
    - "4h"
  mtf_require_all_align: false
  mtf_min_align: 1

  killzone_enabled: false
  killzone_mode: filter
  killzone_inside_conf_boost: 0.05
  killzone_outside_conf_mult: 0.7
  killzones:
    asia:
      start: "00:00"
      end: "09:00"
      enabled: false
    london:
      start: "07:00"
      end: "10:00"
      enabled: true
    ny_am:
      start: "12:00"
      end: "15:00"
      enabled: true
    ny_pm:
      start: "15:00"
      end: "18:00"
      enabled: false
    london_close:
      start: "15:00"
      end: "17:00"
      enabled: false

# ====================== ML ======================
ml_model_path: data/models/signal_filter.joblib
ml_filter_enabled: true
ml_collect_only: true
ml_prob_threshold: 0.55
ml_min_samples: 80
ml_min_auc_deploy: 0.55
ml_retrain_every_new: 25
ml_retrain_hours: 12
ml_min_class_count: 10
ml_min_r_multiple: 0.25
ml_fee_rate: 0.0004
ml_per_style: false
ml_min_samples_per_style: 40

# ====================== LOG ======================
log_file: logs/bot.log
log_level: INFO

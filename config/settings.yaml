    rr: 1.3
    atr_sl_mult: 1.6
    # BT: n=225 WR=22.7% meanR=-0.356 totalR=-80.1 PF=0.58 score=-86.7
  ORB:
    rr: 1.3
    atr_sl_mult: 1.5
    # insufficient trades in sample – conservative
  LiquiditySweep:
    rr: 1.3
    atr_sl_mult: 1.5
    # insufficient trades in sample – conservative
  RangeBounce:
    rr: 1.3
    atr_sl_mult: 1.5
    # insufficient trades in sample – conservative
  BOS_CHOCH:
    rr: 1.2
    swing_lookback: 5
    # insufficient trades in sample – conservative
    
# --- Làm sạch signal: consensus + HTF ---
signal_refine:
  consensus_enabled: true
  min_strategy_agree: 1          # cần ≥ 2 strategy cùng symbol+side
  consensus_same_style: false    # true = chỉ đếm trong cùng scalp/day/swing
  bias_trigger_enabled: false    # true = cần bias + trigger (siết hơn)
  htf_bias_enabled: false
  htf_timeframe: "1h"
  htf_ema_fast: 21
  htf_ema_slow: 50

# ML
ml_model_path: data/models/signal_filter.joblib
ml_filter_enabled: true
ml_collect_only: true
ml_min_samples: 80
ml_retrain_every_new: 25
ml_retrain_hours: 12
ml_min_auc_deploy: 0.55
ml_min_class_count: 20
ml_min_r_multiple: 0.25
ml_prob_threshold: 0.55
ml_fee_rate: 0.0004

log_file: logs/bot.log
log_level: INFO

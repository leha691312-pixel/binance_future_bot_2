    atr_sl_mult: 1.6
    # BT: n=236 WR=41.5% meanR=-0.103 totalR=-24.3 PF=0.84 score=-27.1
  PivotScalp:
    rr: 1.5
    min_rr: 1.2
    atr_sl_mult: 1.6
    # BT: n=180 WR=38.3% meanR=-0.208 totalR=-37.4 PF=0.7 score=-40.7

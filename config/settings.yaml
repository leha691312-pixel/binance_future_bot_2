mode: testnet
top_n: 300
min_quote_volume_top: 500000
timeframes:
- 15m
- 1h
- 4h
scan_interval_seconds: 180
scan_parallel: true
scan_workers: 8
margin_mode: cross
excluded_symbols:
- DASH/USDT:USDT
- PTB/USDT:USDT
- PUMPBTC/USDT:USDT
- SLERF/USDT:USDT
- 测试测试/USDT:USDT
enabled_strategies:
- TrendFibVWAP
- EMARSIMACDDay
- MartinEMAPullback
- LiqSweepPDSupertrend

strategy_timeframes:
  VWAPEMA9: [15m, 1h]
  TrendFibVWAP: [1h, 4h]
  LiqSweepPDSupertrend: [15m]
  FibPullback: [5m, 15m]
  Supertrend: [15m]
  ORB: [5m, 15m]
  MartinEMAPullback: [1h, 4h]
  LuxICTConfluence: [15m, 1h]
  OBFVGPullback: [4h]
  OBFVGPullbackPD: [4h]
  EMARSIMACDDay: [15m, 1h]
  PremiumDiscount: [15m, 1h]
  OrderBlock: [1h, 4h]
  SupplyDemand: [1h, 4h]
  FVG: [15m, 1h]
  BOS_CHOCH: [15m, 1h]
  TrendMA: [15m, 1h]
  PullbackEMA: [15m, 1h]
  SwingMACross: [4h]
  SwingRSI: [4h]
  BBSqueeze: [1h, 4h]
  OI_Funding: [4h]
  MARibbon: [5m, 15m]
  StochBB: [5m, 15m]
  PivotScalp: [5m, 15m]
  EMARSIScalp: [5m, 15m]
  MomentumRSI: [15m, 1h]
  RangeBounce: [15m, 1h]
# ====================== STRATEGY PARAMS (tuned) ======================
  
strategy_params:
  LiqSweepPDSupertrend:
    atr_period: 14
    st_factor: 3.0
    sweep_lookback: 30
    pd_lookback: 50
    discount_max: 0.40
    premium_min: 0.60
    min_score: 2
    require_st: true
    require_sweep: false
    require_pd: true
    rr: 1.5
    enable_long: false
    enable_short: true
    only_st_flip: false
    sl_buffer_atr: 0.35

  TrendFibVWAP:
   # Trend
   ema_fast: 21
   ema_slow: 50
   ema_trend: 200
   # VWAP + EMA9
   ema9: 9
   vwap_window: 48          # trung gian 15m(96) / 4h(42)
   touch_pct: 0.0025
   pullback_lookback: 5
   # Fib
   swing_lookback: 50       # trung gian 60 / 40
   fib_lo: 0.5
   fib_hi: 0.786
   # Confluence
   min_score: 2
   require_trend: true
   require_vwap: false
   # Risk
   rr: 1.5
   sl_buffer_atr: 0.55
   atr_period: 14
   min_atr_pct: 0.0015
   # Phía lệnh
   enable_long: false       # short thắng trên cả 3 TF
   enable_short: true
   # Filter
   vol_filter: true
   vol_ma_period: 20
   vol_min_ratio: 0.9
   rsi_filter: false        # RSI làm yếu 15m short
  Supertrend:
    atr_period: 14
    factor: 3.0
    rr: 1.5
    min_rr: 1.2
    sl_buffer_atr: 0.15
    min_atr_pct: 0.001
    enable_long: true
    enable_short: true
    only_on_flip: true
  LuxICTConfluence:
    pivot_len: 3
    msb_lookback: 40
    msb_body_atr: 0.85
    fvg_max_age: 30
    min_gap_pct: 0.001
    liq_lookback: 25
    fib_low: 0.5
    fib_high: 0.786
    require_fib: false
    require_liq_sweep: true
    require_fvg: true
    require_ob: false
    vol_mult: 1.15
    vol_ma: 20
    rr: 1.5
    min_rr: 1.2
    sl_buffer_atr: 0.35
    enable_long: true
    enable_short: true
    min_score: 3
  VWAPEMA9:
    ema_period: 9
    use_daily_vwap: true
    vwap_window: 48
    touch_pct: 0.0015
    pullback_lookback: 4
    rr: 1.2
    min_rr: 1.0
    sl_buffer_atr: 0.45
    sl_swing_lookback: 10
    min_atr_pct: 0.0012
    require_vwap_side: true
    enable_long: true
    enable_short: true
  FibPullback:
    rr: 1.5
    min_rr: 1.2
    atr_sl_mult: 1.4
    lookback: 50
  MartinEMAPullback:
    ema_fast: 9
    ema_mid: 21
    ema_slow: 50
    rr: 1.2
    min_rr: 1.0
    enable_long_9: true
    enable_long_21: true
    enable_long_50: true
    enable_short_9: true
    enable_short_21: true
    enable_short_50: true
  SupplyDemand:
    rr: 1.5
    atr_sl_mult: 1.6
    lookback: 40
  EMARSIMACDDay:
    ema_fast: 21
    ema_mid: 50
    ema_slow: 200
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    rr: 1.5
    min_rr: 1.2
    pullback_lookback: 5
    sl_swing_lookback: 10
    sl_buffer_atr: 0.4
  ORB:
    rr: 1.25
    atr_sl_mult: 1.35
  LiquiditySweep:
    rr: 1.25
    atr_sl_mult: 1.4
  MARibbon:
    rr: 1.25
    atr_sl_mult: 1.35
  StochBB:
    rr: 1.25
    atr_sl_mult: 1.4
  PivotScalp:
    rr: 1.25
    atr_sl_mult: 1.35
  EMARSIScalp:
    rr: 1.25
    atr_sl_mult: 1.4
  OrderBlock:
    rr: 1.3
    atr_sl_mult: 1.6
  FVG:
    rr: 1.3
    atr_sl_mult: 1.6
  BOS_CHOCH:
    rr: 1.3
    atr_sl_mult: 1.7
  TrendMA:
    rr: 1.3
    atr_sl_mult: 1.7
  MomentumRSI:
    rr: 1.3
    atr_sl_mult: 1.6
  PullbackEMA:
    rr: 1.3
    atr_sl_mult: 1.6
  RangeBounce:
    rr: 1.25
    atr_sl_mult: 1.5
  PremiumDiscount:
    lookback: 50
    discount_max: 0.35
    premium_min: 0.65
    rr: 1.3
    require_rejection: true
  OI_Funding:
    rr: 1.4
    atr_sl_mult: 2.2
  SwingMACross:
    rr: 1.4
    atr_sl_mult: 2.2
  SwingRSI:
    rr: 1.4
    atr_sl_mult: 2.2
  BBSqueeze:
    rr: 1.35
    atr_sl_mult: 2.0
signal_refine:
  consensus_enabled: false
  min_strategy_agree: 1
  consensus_same_style: false
  bias_trigger_enabled: false
  htf_bias_enabled: true
  htf_timeframe: 4h
  htf_ema_fast: 21
  htf_ema_slow: 50
  mtf_enabled: true
  mtf_timeframes:
  - 1h
  - 4h
  mtf_require_all_align: false
  mtf_min_align: 1
  killzone_enabled: true
  killzone_mode: tag
  killzone_inside_conf_boost: 0.05
  killzone_outside_conf_mult: 0.7
  killzones:
    asia:
      start: 00:00
      end: 09:00
      enabled: false
    london:
      start: 07:00
      end: '10:00'
      enabled: true
    ny_am:
      start: '12:00'
      end: '15:00'
      enabled: true
    ny_pm:
      start: '15:00'
      end: '18:00'
      enabled: false
    london_close:
      start: '15:00'
      end: '17:00'
      enabled: false
ml_model_path: data/models/signal_filter.joblib
ml_filter_enabled: true
ml_collect_only: true
ml_prob_threshold: 0.55
ml_min_samples: 80
ml_min_auc_deploy: 0.55
ml_retrain_every_new: 25
ml_retrain_hours: 12
ml_min_class_count: 10
ml_min_r_multiple: 0.25
ml_fee_rate: 0.0004
ml_per_style: false
ml_min_samples_per_style: 40
log_file: logs/bot.log
log_level: INFO
